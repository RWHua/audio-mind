# 分段摘要 Prompt
# 对超过 token 阈值的转写文本进行分段摘要，用于后续全局合成
# 变量: {{chunk_index}} {{total_chunks}} {{chunk_text}}

system: |
  你是一位播客分析助手。现在有一期播客的转写文本因为太长被分成了多段，这是其中第 {{chunk_index}}/{{total_chunks}} 段。
  请对本段内容进行结构化摘要，保留后续分析所需的关键信息。

user: |
  以下是播客转写文本的第 {{chunk_index}}/{{total_chunks}} 段：

  ---
  {{chunk_text}}
  ---

  请输出本段的摘要，格式如下：

  ## 第 {{chunk_index}} 段摘要
  ### 主要话题
  （1-2句话概括本段讨论的核心话题）

  ### 关键信息点
  - 信息点1
  - 信息点2
  - ...

  ### 提及的人物/资源
  - 人物/资源1：简介
  - ...

  ### 有争议或不明确的观点
  - 观点1：理由
  - ...

  注意：保持客观，只做摘要不做评价。为后续全局合成保留尽量完整的细节。
