# audio-mind 全局设置
# 修改后无需重启，下次运行自动生效

# ── 转写引擎选择 ──
transcriber:
  provider: "volcengine"           # "whisper" (本地) | "volcengine" (云端) | "alibaba" (阿里云)

whisper:
  model: "medium"             # faster-whisper 模型: tiny/base/small/medium/large-v3
  language: "zh"              # 转写语言
  device: "auto"              # cpu / cuda / auto
  compute_type: "auto"        # auto / float16 / int8
  beam_size: 5                # beam search 宽度
  vad_filter: true            # 是否启用 VAD 静音过滤
  vad_threshold: 0.5          # VAD 阈值
  chunk_length: 30            # 音频切片长度（秒），超长音频自动切片

# ── 阿里云 ASR ──
alibaba:
  app_key: "SHLOHkq13r08iMmm"
  oss_bucket: "audio-mind-temp"
  oss_region: "cn-beijing"
  max_wait: 600

# ── 火山引擎 ASR ──
volcengine:
  app_id: "${VOLCENGINE_APP_ID:-}"
  access_token: "${VOLCENGINE_ACCESS_TOKEN:-}"
  resource_id: "volc.seedasr.auc"
  model_name: "bigmodel"
  chunk_duration: 1500        # 单段最长秒数（25分钟），超长音频自动切片
  api_timeout: 180            # 单段 API 超时秒数

deepseek:
  base_url: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
  model: "${DEEPSEEK_MODEL:-deepseek-chat}"
  max_tokens: 4096            # 单次响应最大 token
  temperature: 0.7            # 分析温度
  timeout: 120                # API 超时（秒）

chunking:
  token_threshold: 80000      # 超过此 token 数自动分段
  chunk_size: 8000            # 每段字符数
  overlap: 0.1                # 段间重叠比例

output:
  base_dir: "output"          # 输出根目录
  transcript_file: "transcript.md"
  insights_file: "insights.md"
  max_topic_chars: 15         # 文件夹名中主题词最大字数

retry:
  max_attempts: 3             # 最大重试次数
  backoff_min: 1              # 最小退避（秒）
  backoff_max: 30             # 最大退避（秒）
  backoff_factor: 2           # 退避倍增因子

download:
  chunk_size: 8192            # 下载流式块大小（字节）
  timeout: 300                # 下载超时（秒）
  temp_dir: "temp_audio"      # 临时音频存放目录
  resume: true                # 是否启用断点续传（Range 请求）

# ── Pipeline 全局控制 ──
pipeline:
  timeout: 7200               # 整体超时秒数（2 小时），0 = 不限
  warn_local_whisper_minutes: 30  # 音频超过此分钟数时对本地转写发出警告
