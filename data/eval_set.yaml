- id: ev-010
  query: "嘉宾为啥觉得大家不会把重要的东西都传到云上？这里面有什么门槛？"
  answer: "嘉宾观察到人的天然倾向是把不重要的东西放到网上，真正珍贵、宝贵的东西反而放在个人私密、自己可控的地方。而且把全部记忆交给开放网络要越过很多门槛：要考虑有没有网络、某些服务能否访问，还要算存储成本和 token 算力消耗，所以他认为个人的记忆天然更适合放在端上。"
