- id: ev-013
  query: "真要把个人记忆系统做出来，从技术架构上大概要分哪几层？跟眼镜这些设备怎么接？"
  answer: "嘉宾对 memory layer 的构想大致是：先做几乎无感的数据导入，整合本地、云端和眼镜等智能设备所有产生数据的数据源；数据进来后要理解并提炼出原子化信息，在其上构建知识层（下面是模型层）；最上层是 Agent 层，知识以 Agent 方式与用户交互，还可通过 MCP、API 等把自己的记忆与外部生态、同事朋友共享连接。"
