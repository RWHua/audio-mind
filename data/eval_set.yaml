- id: ev-006
  query: "我让 AI 写代码总觉得它又慢又蠢，明明两分钟的活能磨四分钟，还老走弯路，这种问题该怎么治？"
  answer: "徐文浩认为 agent 慢的根源是经常犯'愚蠢的错误'：比如想用 Perl 写脚本但沙盒里没权限或路径找错，它会很努力地换个方法绕过去，导致本来两分钟能干的活拖成四分钟。他的解法是写了一个叫 optimize harness（自我进化）的 skill：定期扫描 agent 执行任务时的各种摩擦——被沙盒拦截的权限、缺的命令和库、临时写的脚本等，生成优化计划，由人挑选后执行（如装好 Perl、给足权限）。效果是 agent 干活变快、耗的 token 也变少，本质是低级错误犯得少了。"
  type: multi-hop
  difficulty: hard
  source:
    podcast: "AI炼金术"
    episode: "纯VibeCoding做大项目"
    episode_url: "https://www.xiaoyuzhoufm.com/"
  evidence:
    - start_sec: 2170
      end_sec: 2204
      quote: |-
        徐文浩: 我现在面临一个问题，就是很多时候我觉得 agent 在干活很慢。
        徐文浩: 干活很慢的原因是什么呢？
        徐文浩: 就是我盯着他干活，我会发现他有时候会犯一些错，而且有些比较愚蠢的错误他经常会犯。
        徐文浩: 因为我在一些沙盒里，他有一些权限，他就会用一种方法试了不通，他其实是我应该去配置一下他的权限。
        徐文浩: 这个问题本来就被解决了。
        徐文浩: 但是 AI 呢，它非常努力，对吧？
        徐文浩: 它是个很听话，它就换了一个方法绕开了，最后这个问题也被解决了，对不对？
        徐文浩: 但其实就导致这个 agent 呢，干这个活本来两分钟能干完的，它可能干了四分钟。
        徐文浩: 然后你的感觉就是它很慢。
    - start_sec: 2207
