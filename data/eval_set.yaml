- id: ev-005
  query: "我们团队人不多，代码又天天在合，靠人肉 review 根本审不过来，怎么把代码审核和质量检查变成自动化的？"
  answer: "徐文浩团队重度使用 GitHub，把审核和质量检查全部自动化：提交代码后、合并前 AI 自动做 code review 并提意见，而且是双重的（codex 也会 review），还有很高的自动化测试覆盖，自动化测试还会录屏供人查看。Quality 门禁有几十步检查，包括代码格式、代码重复率（Duplicate check）、lint 规则、命名和依赖关系等。此外还会定期自动扫描整个代码库做架构 review 提出 findings，Autofix 自动扫描线上报错、修完发通知让人工验收。"
