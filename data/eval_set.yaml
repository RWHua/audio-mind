- id: ev-004
  query: "网上说用 Discord 配合 OpenClaw 可以同时管好几个 AI，还能让它们各干各的、上下文不串味，这到底是怎么做到的？"
  answer: "核心是三层结构：建一个 Discord server（相当于一个大论坛），里面建多个 channel（不同板块），每个 channel 关联到 OpenClaw 里配置好的一个 Agent（workspace），不同 channel 配不同的人设、skills、上下文和模型（如 Everyday、Dev、Research、ZooKeeper）；同一个 agent 下想同时干两件事就开 thread，thread 的上下文不会和主会话混在一起。这样不同类型的任务上下文不串、还能并发干活，是 Claude Code 目前做不到的。"
  type: multi-hop
  difficulty: medium
  source:
    podcast: "AI炼金术"
    episode: "纯VibeCoding做大项目"
    episode_url: "https://www.xiaoyuzhoufm.com/"
