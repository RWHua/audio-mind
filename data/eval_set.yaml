- id: ev-009
  query: "这个叫 Clipto 的东西到底是干嘛的？它靠什么把硬盘里的内容变成能随时查的记忆？"
  answer: "Clipto 是嘉宾创立的、几乎 100% 在用户本地 PC 上运行的应用，用户授权它访问硬盘、外接硬盘甚至网盘，底层用音频、视频、人脸、OCR 等约 10 个模型把内容理解成结构化知识单元，再构建时空对齐的知识记忆系统。用户可以用文本或语音随时查找回溯记忆，还能在已有记忆上做二次生成，或把某段记忆作为上下文引入与 Agent 的对话。"
  type: fact
  difficulty: medium
  source:
    podcast: "What's Next｜科技早知道"
    episode: "E20"
    episode_url: "https://www.xiaoyuzhoufm.com/"
  evidence:
