- id: ev-002
  query: "我手里就一份书稿或者一份代码，想让 AI 同时试两个完全不同的想法，又怕两边互相搞乱，这种场景有没有现成的解决办法？"
  answer: "用 Worktree（工作分支）。徐文浩用写小说举例：同一份书稿上可以开两个分叉，让两个 Agent 分别实验'女主挂了'和'女主穿越'两个剧情设想，互相之间不干扰，不会把同一份书稿搞乱。每个工作都在分支里完成后，确定要的就保留，不要的就扔掉。"
  type: fact
  difficulty: easy
  source:
