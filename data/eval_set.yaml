        徐文浩: 所以呢，就我写了一个 skill 其实很很容易理解，就是这个 skills 就是叫做找到你实际在执行任务中遇到的各种摩擦，对吧？
        徐文浩: 有哪些沙盒拦截了？
        徐文浩: 有哪些审批事，升升级了，他缺哪些命令，哪些库，你什么临时候临时写各种脚本，然后你帮我扫描出来，然后给我一个优化计划。
        徐文浩: 他给我优化计划，我说我看一下，我选择一些我觉得 ok 的，我去执行。
