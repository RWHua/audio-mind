[project]
name = "audio-mind"
version = "1.0.0"
description = "自动播客洞察 Agent：下载、转写、基于用户画像提取个性化洞察"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "faster-whisper>=1.0.0",
    "pydub>=0.25.1",
    "openai>=1.30.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
    "oss2>=2.19.1",
    "mutagen>=1.47.0",
]

[project.scripts]
audio-mind = "src.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: tests that require API keys and network access",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
